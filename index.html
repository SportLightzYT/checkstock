<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ SpeedTest - วัดความเร็วอินเทอร์เน็ต</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#131a2e;--accent:#00d4ff;--accent2:#7c3aed;--text:#e2e8f0;--muted:#64748b;--success:#10b981;--glow:0 0 20px rgba(0,212,255,.3)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;padding:20px}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(0,212,255,.06) 0%,transparent 50%);animation:bgPulse 8s ease-in-out infinite alternate;z-index:-1}
@keyframes bgPulse{0%{transform:scale(1) rotate(0deg)}100%{transform:scale(1.05) rotate(2deg)}}
.container{width:100%;max-width:700px;text-align:center}
h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:30px}
.gauge-wrap{position:relative;width:280px;height:280px;margin:0 auto 30px}
.gauge-svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:#1e293b;stroke-width:12;stroke-linecap:round}
.gauge-fill{fill:none;stroke:url(#gaugeGrad);stroke-width:12;stroke-linecap:round;stroke-dasharray:565.48;stroke-dashoffset:565.48;transition:stroke-dashoffset .3s ease}
.gauge-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gauge-value{font-size:clamp(2.5rem,8vw,3.5rem);font-weight:900;color:#fff;line-height:1}
.gauge-unit{font-size:.9rem;color:var(--muted);margin-top:4px}
.gauge-label{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-top:8px;font-weight:600}
.btn-start{position:relative;padding:16px 48px;font-size:1.1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:50px;cursor:pointer;transition:all .3s ease;box-shadow:var(--glow);text-transform:uppercase;letter-spacing:1px}
.btn-start:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 40px rgba(0,212,255,.5)}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-start .spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle}
.btn-start.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;opacity:0;transform:translateY(20px);transition:all .5s ease}
.results.show{opacity:1;transform:translateY(0)}
.result-card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px 12px;transition:all .3s ease}
.result-card:hover{border-color:rgba(0,212,255,.3);transform:translateY(-3px)}
.result-icon{font-size:1.5rem;margin-bottom:8px}
.result-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.result-value{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;color:#fff}
.result-unit{font-size:.7rem;color:var(--muted)}
.result-card.ping .result-value{color:#f59e0b}
.result-card.down .result-value{color:var(--accent)}
.result-card.up .result-value{color:var(--success)}
.status{margin-top:20px;font-size:.85rem;color:var(--muted);min-height:24px;transition:all .3s}
.status.active{color:var(--accent)}
.progress-bar{width:100%;height:4px;background:#1e293b;border-radius:2px;margin-top:16px;overflow:hidden;opacity:0;transition:opacity .3s}
.progress-bar.show{opacity:1}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width .3s ease}
.server-info{margin-top:20px;font-size:.75rem;color:var(--muted);opacity:.7}
@media(max-width:480px){.gauge-wrap{width:220px;height:220px}.results{grid-template-columns:1fr;gap:12px}.result-card{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px}.result-icon{margin:0;font-size:1.2rem}.result-label{margin:0}.result-value{margin-left:auto}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeInUp .6s ease}
</style>
</head>
<body>
<div class="container">
<h1>⚡ SpeedTest</h1>
<p class="subtitle">วัดความเร็วอินเทอร์เน็ตของคุณ — 100% Client-Side</p>

<div class="gauge-wrap">
<svg class="gauge-svg" viewBox="0 0 200 200">
<defs>
<linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="50%" stop-color="#00d4ff"/>
<stop offset="100%" stop-color="#10b981"/>
</linearGradient>
</defs>
<circle class="gauge-bg" cx="100" cy="100" r="90" stroke-dasharray="424.12" stroke-dashoffset="0" pathLength="360"/>
<circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="90"/>
</svg>
<div class="gauge-center">
<div class="gauge-value" id="gaugeValue">0</div>
<div class="gauge-unit" id="gaugeUnit">Mbps</div>
<div class="gauge-label" id="gaugeLabel">พร้อมทดสอบ</div>
</div>
</div>

<button class="btn-start" id="btnStart" onclick="startTest()">
<span class="spinner"></span>
<span id="btnText">START SPEEDTEST</span>
</button>

<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<div class="status" id="status"></div>

<div class="results" id="results">
<div class="result-card ping">
<div class="result-icon">📡</div>
<div><div class="result-label">Ping</div><div class="result-value" id="resPing">—</div><div class="result-unit">ms</div></div>
</div>
<div class="result-card down">
<div class="result-icon">⬇️</div>
<div><div class="result-label">Download</div><div class="result-value" id="resDown">—</div><div class="result-unit">Mbps</div></div>
</div>
<div class="result-card up">
<div class="result-icon">⬆️</div>
<div><div class="result-label">Upload</div><div class="result-value" id="resUp">—</div><div class="result-unit">Mbps</div></div>
</div>
</div>

<div class="server-info">🌐 Server: Cloudflare CDN & httpbin.org | Cache-Busting: Active</div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const gaugeFill=$('gaugeFill'),gaugeValue=$('gaugeValue'),gaugeUnit=$('gaugeUnit'),gaugeLabel=$('gaugeLabel');
const btnStart=$('btnStart'),btnText=$('btnText'),status=$('status');
const progressBar=$('progressBar'),progressFill=$('progressFill');
const CIRCUMFERENCE=2*Math.PI*90;
gaugeFill.style.strokeDasharray=CIRCUMFERENCE;
gaugeFill.style.strokeDashoffset=CIRCUMFERENCE;
let testing=false;

function setGauge(pct,val,unit,label){
const offset=CIRCUMFERENCE-(pct/100)*CIRCUMFERENCE*0.75;
gaugeFill.style.strokeDashoffset=offset;
gaugeValue.textContent=val;
gaugeUnit.textContent=unit;
gaugeLabel.textContent=label;
}
function setStatus(msg,active){status.textContent=msg;status.className='status'+(active?' active':'');}
function setProgress(pct){progressBar.classList.add('show');progressFill.style.width=pct+'%';}
function cacheBust(){return '_cb='+Date.now()+'_'+Math.random().toString(36).substr(2,9);}

async function measurePing(){
setStatus('📡 กำลังวัด Ping / Latency...',true);
gaugeLabel.textContent='PING';
const urls=[
'https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js',
'https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js',
'https://unpkg.com/axios@1.6.0/dist/axios.min.js'
];
const pings=[];
const rounds=10;
for(let i=0;i<rounds;i++){
const url=urls[i%urls.length]+'?'+cacheBust();
const t0=performance.now();
try{
await fetch(url,{method:'HEAD',cache:'no-store',mode:'cors'});
const t1=performance.now();
pings.push(t1-t0);
}catch(e){
try{
const t0b=performance.now();
await fetch(url,{cache:'no-store',mode:'cors'});
pings.push(performance.now()-t0b);
}catch(e2){pings.push(999);}
}
setGauge(Math.min((i+1)/rounds*100,100),pings[pings.length-1].toFixed(0),'ms','PING');
setProgress(10+((i+1)/rounds)*20);
await new Promise(r=>setTimeout(r,50));
}
pings.sort((a,b)=>a-b);
const trimmed=pings.slice(1,-1);
const avg=trimmed.reduce((s,v)=>s+v,0)/trimmed.length;
return Math.round(avg*10)/10;
}

async function measureDownload(){
setStatus('⬇️ กำลังวัด Download Speed...',true);
gaugeLabel.textContent='DOWNLOAD';
const sizes=[5000000,10000000,25000000];
let totalBytes=0,totalTime=0;
const startTime=performance.now();
const duration=12000;
let chunkIdx=0;
while(performance.now()-startTime<duration){
const size=sizes[chunkIdx%sizes.length];
const url='https://speed.cloudflare.com/__down?bytes='+size+'&'+cacheBust();
const t0=performance.now();
try{
const resp=await fetch(url,{cache:'no-store',mode:'cors'});
const reader=resp.body.getReader();
let received=0;
while(true){
const{done,value}=await reader.read();
if(done)break;
received+=value.length;
const elapsed=(performance.now()-t0)/1000;
if(elapsed>0.3){
const speedMbps=(received*8)/(elapsed*1000000);
const pct=Math.min(((performance.now()-startTime)/duration)*100,100);
setGauge(pct,speedMbps.toFixed(1),'Mbps','DOWNLOAD');
setProgress(30+pct*0.4);
}
}
totalBytes+=received;
totalTime+=(performance.now()-t0)/1000;
}catch(e){
try{
const fallbackUrl='https://cdn.jsdelivr.net/gh/nicehash/NiceHashQuickMiner@main/NiceHashQuickMiner.exe?'+cacheBust();
const t0f=performance.now();
const resp=await fetch(fallbackUrl,{cache:'no-store',mode:'cors'});
const blob=await resp.blob();
const elapsed=(performance.now()-t0f)/1000;
totalBytes+=blob.size;
totalTime+=elapsed;
}catch(e2){break;}
}
chunkIdx++;
if(performance.now()-startTime>duration)break;
}
if(totalTime===0)return 0;
const speedMbps=(totalBytes*8)/(totalTime*1000000);
return Math.round(speedMbps*100)/100;
}

async function measureUpload(){
setStatus('⬆️ กำลังวัด Upload Speed...',true);
gaugeLabel.textContent='UPLOAD';
const sizes=[1000000,2000000,5000000];
let totalBytes=0,totalTime=0;
const startTime=performance.now();
const duration=10000;
let chunkIdx=0;
while(performance.now()-startTime<duration){
const size=sizes[chunkIdx%sizes.length];
const data=new Blob([new ArrayBuffer(size)]);
const url='https://httpbin.org/post?'+cacheBust();
const t0=performance.now();
try{
await fetch(url,{method:'POST',body:data,cache:'no-store',mode:'cors',headers:{'Content-Type':'application/octet-stream'}});
const elapsed=(performance.now()-t0)/1000;
totalBytes+=size;
totalTime+=elapsed;
const speedMbps=(size*8)/(elapsed*1000000);
const pct=Math.min(((performance.now()-startTime)/duration)*100,100);
setGauge(pct,speedMbps.toFixed(1),'Mbps','UPLOAD');
setProgress(70+pct*0.3);
}catch(e){
try{
const url2='https://speed.cloudflare.com/__up?'+cacheBust();
const t0b=performance.now();
await fetch(url2,{method:'POST',body:data,cache:'no-store',mode:'cors'});
const elapsed=(performance.now()-t0b)/1000;
totalBytes+=size;
totalTime+=elapsed;
}catch(e2){}
}
chunkIdx++;
await new Promise(r=>setTimeout(r,100));
if(performance.now()-startTime>duration)break;
}
if(totalTime===0)return 0;
const speedMbps=(totalBytes*8)/(totalTime*1000000);
return Math.round(speedMbps*100)/100;
}

window.startTest=async function(){
if(testing)return;
testing=true;
btnStart.disabled=true;
btnStart.classList.add('loading');
btnText.textContent='กำลังทดสอบ...';
$('results').classList.remove('show');
$('resPing').textContent='—';
$('resDown').textContent='—';
$('resUp').textContent='—';
setGauge(0,'0','Mbps','พร้อมทดสอบ');
setProgress(0);
try{
const ping=await measurePing();
$('resPing').textContent=ping;
setGauge(100,ping,'ms','PING ✓');
await new Promise(r=>setTimeout(r,600));

const down=await measureDownload();
$('resDown').textContent=down.toFixed(2);
setGauge(100,down.toFixed(1),'Mbps','DOWNLOAD ✓');
await new Promise(r=>setTimeout(r,600));

const up=await measureUpload();
$('resUp').textContent=up.toFixed(2);
setGauge(100,up.toFixed(1),'Mbps','UPLOAD ✓');

setProgress(100);
setStatus('✅ ทดสอบเสร็จสิ้น!',false);
gaugeLabel.textContent='เสร็จสิ้น ✓';
gaugeValue.textContent=down.toFixed(1);
gaugeUnit.textContent='Mbps';
$('results').classList.add('show');
}catch(err){
setStatus('❌ เกิดข้อผิดพลาด: '+err.message,false);
console.error(err);
}finally{
testing=false;
btnStart.disabled=false;
btnStart.classList.remove('loading');
btnText.textContent='ทดสอบอีกครั้ง';
setTimeout(()=>{progressBar.classList.remove('show');},2000);
}
};
})();
</script>
</body>
</html>
